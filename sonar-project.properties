# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_defra-ai-plugins
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/defra-ai-plugins
sonar.links.ci=https://github.com/DEFRA/defra-ai-plugins/actions
sonar.links.scm=https://github.com/DEFRA/defra-ai-plugins
sonar.links.issue=https://github.com/DEFRA/defra-ai-plugins/issues

sonar.sources=scripts/,plugins/
sonar.exclusions=**/*.test.js,**/*.test.mjs,node_modules/**
sonar.tests=scripts/,plugins/
sonar.test.inclusions=**/*.test.js,**/*.test.mjs

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=**/*.test.js,**/*.test.mjs,**/eval-fixture/**,**/evals/**
