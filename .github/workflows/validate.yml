name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint and validate plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Cache spaCy model
        uses: actions/cache@v4
        with:
          path: ~/.cache/defra-pii-redaction
          key: spacy-en-core-web-sm-3.8.0

      - name: Preload PII redaction model
        run: uv run plugins/defra-pii-redaction/scripts/redact_pii.py --preload

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint scripts
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Validate marketplace and plugins
        run: npm test
