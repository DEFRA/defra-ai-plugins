name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint and validate plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.13'

      - name: Cache spaCy model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/defra-pii-redaction
          key: spacy-en-core-web-sm-3.8.0

      - name: Preload PII redaction model
        run: uv run --locked --no-build plugins/defra-pii-redaction/scripts/redact_pii.py --preload

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint scripts
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Validate marketplace and plugins
        run: npm test
