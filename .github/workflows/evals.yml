name: Evals

# Behavioural eval for the plugins. Drives Copilot CLI in non-interactive mode
# against the in-tree eval fixture (`eval-fixture/hapi-frontend/`) using
# fixtures in `plugins/frontend-developer/evals/`. Fails the build if any
# fixture that PASSED in the committed baseline now fails.
#
# Schema/structural validation is in `validate.yml` and runs separately.
#
# Auth: this workflow needs the COPILOT_GITHUB_TOKEN repository secret. Create
# a fine-grained PAT (or GitHub App token) with the "Copilot Requests"
# permission and store it as COPILOT_GITHUB_TOKEN. See README §Evaluating.
#
# CI installs the plugin from the PR checkout (`copilot plugin install
# ./plugins/frontend-developer`), so behavioural changes on the branch are
# exercised before merge. `COPILOT_HOME` is pinned to a per-run temp dir to
# defeat any cross-job plugin cache reuse.

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Behavioural eval (Copilot CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_MODEL: gpt-5-mini
      # Isolated config/plugin dir so the install in this job can't be
      # served from a previous run's cache.
      COPILOT_HOME: ${{ runner.temp }}/copilot-ci
    steps:
      - name: Check secret is configured
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "::error::COPILOT_GITHUB_TOKEN secret is not configured."
            echo "::error::See README §Evaluating for setup instructions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install eval-fixture dependencies
        run: cd plugins/frontend-developer/eval-fixture && npm install

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install frontend-developer plugin from PR checkout
        run: |
          mkdir -p "$COPILOT_HOME"
          # Local-path install: Copilot CLI accepts a directory argument and
          # copies it into $COPILOT_HOME/installed-plugins/_direct/. This is
          # what makes the eval gate the PR's plugin code, not main's.
          copilot plugin install ./plugins/frontend-developer
          copilot plugin list

      - name: Run eval suite
        id: run
        run: |
          mkdir -p results/run-${{ github.sha }}
          cd plugins/frontend-developer/evals
          # promptfoo's own exit code already gates new fixtures.
          # We capture but do not fail-fast here so we can run the
          # baseline-regression gate even when there are new fixtures
          # failing (which we want to know about either way).
          set +e
          npx promptfoo eval \
            --no-cache \
            --filter-providers copilot-cli-frontend-developer \
            --output "$GITHUB_WORKSPACE/results/run-${{ github.sha }}/promptfoo-results.json"
          echo "promptfoo_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Regression gate vs baseline
        id: gate
        run: |
          ./plugins/frontend-developer/evals/check-regression.sh \
            "results/run-${{ github.sha }}/promptfoo-results.json"

      - name: Summarise
        if: always()
        run: |
          ./plugins/frontend-developer/evals/summarise.sh \
            "results/run-${{ github.sha }}/promptfoo-results.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: results/run-${{ github.sha }}/
          retention-days: 30
