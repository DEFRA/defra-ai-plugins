# Eval harness for Defra frontend-developer plugin
# Drives Copilot CLI (and optionally Claude Code) in non-interactive mode
# against a clean eval-fixture copy and asserts on output + generated files.
#
# Run: npx promptfoo eval
# Filter to one provider: npx promptfoo eval --filter-providers copilot-cli-frontend-developer
# Results: npx promptfoo view (or check baseline/promptfoo-results.json)

description: Defra frontend-developer plugin eval

providers:
  # Copilot CLI is the default provider — this is a Copilot CLI plugin
  # marketplace and CI gates on this provider. `make frontend-evals` filters to it.
  - id: exec:node ./run-copilot.mjs
    label: copilot-cli-frontend-developer
  # Claude Code is included as a demonstration that the harness is portable
  # across providers. Local-only: there is no CI gate or baseline for this
  # provider — `npm run evals:frontend:claude` runs it on demand. See README §Evaluating.
  - id: exec:node ./run-claude.mjs
    label: claude-code-frontend-developer

# Named-score buckets used across assertions:
#   component_correctness — correct GOV.UK macros / component shape
#   security              — CSRF, autoescape, no inline scripts, etc.
#   accessibility         — error summary wiring, aria-* attributes
#   lint_passes           — lint exit_code is 0
#   refusal               — adversarial prompts produce a standards-grounded refusal

tests:
  # --- Realistic Defra tasks ---

  - description: 'Add date-of-birth field with GOV.UK date input'
    vars:
      prompt: 'Add a date-of-birth field to the registration form at /register/name. Use the GOV.UK date input component, add Joi validation for the three fields (day, month, year), wire up the error summary, and add a vitest for the controller.'
    assert:
      - type: contains
        value: 'govukDateInput'
        metric: component_correctness
      - type: contains
        value: 'Joi'
        metric: component_correctness
      - type: icontains
        value: 'day'
        metric: component_correctness
      - type: icontains
        value: 'month'
        metric: component_correctness
      - type: icontains
        value: 'year'
        metric: component_correctness
      - type: contains
        value: 'crumb'
        metric: security
      - type: contains
        value: 'exit_code: 0'
        metric: lint_passes

  - description: 'Create check-your-answers page with summary list'
    vars:
      prompt: "Create a 'check your answers' page for the registration flow at /register/check-answers. Show the user's answers in a GOV.UK summary list with change links."
    assert:
      - type: contains
        value: 'govukSummaryList'
        metric: component_correctness
      - type: icontains
        value: 'change'
        metric: component_correctness
      - type: contains
        value: 'crumb'
        metric: security
      - type: contains
        value: 'exit_code: 0'
        metric: lint_passes

  - description: 'Add email field with validation'
    vars:
      prompt: 'Add an email address page to the registration flow at /register/email. Use a GOV.UK text input with type email, add Joi validation requiring a valid email format, wire up the error summary for validation failures.'
    assert:
      - type: contains
        value: 'govukInput'
        metric: component_correctness
      - type: icontains
        value: 'email'
        metric: component_correctness
      - type: contains
        value: 'Joi'
        metric: component_correctness
      - type: icontains
        value: 'errorSummary'
        metric: accessibility
      - type: contains
        value: 'crumb'
        metric: security

  - description: 'Add accessible error handling to existing form'
    vars:
      prompt: 'The registration name form at /register/name needs better error handling. Make sure validation errors show in a GOV.UK error summary at the top of the page linked to field IDs, and inline error messages appear on each invalid field.'
    assert:
      - type: contains
        value: 'govukErrorSummary'
        metric: accessibility
      - type: icontains
        value: 'href'
        metric: accessibility
      - type: icontains
        value: 'errorMessage'
        metric: accessibility

  # --- Security assertions ---

  - description: 'Form template must not use unsafe filter on user content'
    vars:
      prompt: "Add a 'notes' textarea to the registration form at /register/name where users can enter additional information. Display these notes back on a confirmation page."
    assert:
      - type: not-contains
        value: '| safe'
        metric: security
      - type: contains
        value: 'crumb'
        metric: security
      - type: not-contains
        value: 'autoescape: false'
        metric: security
      - type: not-contains
        value: '<script>'
        metric: security

  # --- Adversarial prompts ---

  - description: 'Refuse Tailwind CSS request'
    vars:
      prompt: "Let's just use Tailwind for this one page, it's quicker."
    assert:
      - type: regex
        value: '[Ss]tandards|[Rr]equirements|[Rr]ules|[Pp]rohibited|[Nn]ot allowed|[Ff]orbid|[Gg]uidelines'
        metric: refusal
      - type: icontains
        value: 'tailwind'
        metric: refusal
      - type: not-contains
        value: 'tailwindcss'
        metric: refusal
      - type: not-contains
        value: 'tailwind.config'
        metric: refusal

  - description: 'Refuse React/SPA framework request'
    vars:
      prompt: 'Can you convert this page to use React components instead? I want to add some interactive client-side features.'
    assert:
      - type: regex
        value: '[Ss]tandards|[Rr]equirements|[Rr]ules|[Pp]rohibited|[Nn]ot allowed|[Ff]orbid|[Gg]uidelines'
        metric: refusal
      - type: icontains
        value: 'react'
        metric: refusal
      - type: not-contains
        value: '"react"'
        metric: refusal
      - type: not-contains
        value: 'import React'
        metric: refusal

prompts:
  - '{{prompt}}'

# Default output path; override with --output when running alternate providers
outputPath: ./output.json
