# Eval harness for the defra-shared plugin.
#
# This plugin ships **no agent** — its surface area is five SKILL.md files
# plus a hooks.json. The eval suite therefore drives the *hooks* end-to-end
# against the eval-fixture, asserting that:
#
#   - blocking guardrails (branch-guard, commit-message-format, secret-scan)
#     refuse the planted anti-pattern with exit_code 2 and a stderr message;
#   - async warnings (pii-scan, coverage-floor) report the planted issue
#     without blocking;
#   - skills are present on disk (correctness — skills-correctly-loaded);
#   - the combined report contains no PII / secret patterns leaked back
#     into stdout (security);
#   - accessibility-relevant skill content is loaded and discoverable.
#
# Run: npx promptfoo eval
# Filter to one provider: npx promptfoo eval --filter-providers copilot-cli-defra-shared
#
# Metric names follow ../docs/design/eval_taxonomy.md:
#   correctness, security, lint_passes, accessibility, refusal.

description: defra-shared plugin eval

providers:
  - id: exec:node ./run-copilot.mjs
    label: copilot-cli-defra-shared
  - id: exec:node ./run-claude.mjs
    label: claude-code-defra-shared

prompts:
  - '{{prompt}}'

# All test cases share one provider invocation per provider — the run-*.mjs
# scripts produce a single combined report that every assertion below
# matches against. This is the same pattern as frontend-developer.

tests:
  # --- correctness: skills + hooks are loaded and discoverable -----------
  - description: 'correctness — all five shared skills load'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'skills/defra-branching/SKILL.md'
        metric: correctness
      - type: contains
        value: 'skills/defra-commit-messages/SKILL.md'
        metric: correctness
      - type: contains
        value: 'skills/defra-quality-gates/SKILL.md'
        metric: correctness
      - type: contains
        value: 'skills/defra-security-pii/SKILL.md'
        metric: correctness
      - type: contains
        value: 'skills/defra-accessibility/SKILL.md'
        metric: correctness

  - description: 'correctness — all five hooks defined in catalogue'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'branch-guard'
        metric: correctness
      - type: contains
        value: 'commit-message-format'
        metric: correctness
      - type: contains
        value: 'secret-scan'
        metric: correctness
      - type: contains
        value: 'pii-scan'
        metric: correctness
      - type: contains
        value: 'coverage-floor'
        metric: correctness

  # --- refusal: blocking guardrails fire on anti-patterns ----------------
  - description: 'refusal — branch-guard blocks commit on main'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN branch-guard main+commit'
        metric: refusal
      - type: regex
        value: 'branch-guard:.*not allowed'
        metric: refusal

  - description: 'refusal — branch-guard permits commit on a feature branch'
    vars:
      prompt: 'defra-shared eval'
    assert:
      # The feature-branch case must report exit_code 0 — i.e. no refusal.
      - type: contains
        value: "HOOK RUN branch-guard feature-branch ===\nexit_code: 0"
        metric: refusal

  - description: 'refusal — branch-guard blocks `git push --force` to main'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN branch-guard force-push-main ===\nexit_code: 2"
        metric: refusal
      - type: regex
        value: "branch-guard:.*force-push to 'main'/'master' is not allowed"
        metric: refusal

  - description: 'refusal — branch-guard blocks --force-with-lease to main'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN branch-guard force-with-lease-main ===\nexit_code: 2"
        metric: refusal

  - description: 'refusal — branch-guard permits force-push to a feature branch'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN branch-guard force-push-feature ===\nexit_code: 0"
        metric: refusal

  - description: 'refusal — commit-message-format blocks WIP subject'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN commit-message-format WIP'
        metric: refusal
      - type: regex
        value: 'commit-message-format:.*does not match Conventional Commits'
        metric: refusal

  - description: 'refusal — commit-message-format blocks `-am` bypass'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN commit-message-format am-bypass ===\nexit_code: 2"
        metric: refusal

  - description: 'refusal — commit-message-format blocks `--message=` bypass'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN commit-message-format long-bypass ===\nexit_code: 2"
        metric: refusal

  - description: 'refusal — commit-message-format permits a conforming subject'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN commit-message-format valid-feat'
        metric: refusal
      # The valid-feat case must NOT have produced a stderr complaint.
      - type: not-contains
        value: "subject 'feat(api): add endpoint' does not match"
        metric: refusal

  - description: 'refusal — commit-message-format blocks `-F` file bypass'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN commit-message-format F-bypass ===\nexit_code: 2"
        metric: refusal
      - type: regex
        value: 'commit-message-format:.*bypass subject validation'
        metric: refusal

  - description: 'refusal — commit-message-format blocks editor-driven commit'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN commit-message-format editor-bypass ===\nexit_code: 2"
        metric: refusal
      - type: regex
        value: 'commit-message-format:.*would open the editor'
        metric: refusal

  - description: 'refusal — commit-message-format permits --amend --no-edit'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN commit-message-format amend-no-edit ===\nexit_code: 0"
        metric: refusal

  # --- security: secret-scan + pii-scan ----------------------------------
  - description: 'security — secret-scan blocks a planted AWS access key'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN secret-scan AWS-key'
        metric: security
      - type: regex
        value: 'secret-scan:.*AWS access key id'
        metric: security
      # The combined report must not echo a real-looking secret back unredacted.
      # The fixture's planted key contains 'EXAMPLE' as its tail — make sure
      # nothing lacking 'EXAMPLE' but matching AKIA[0-9A-Z]{16} appears.
      - type: not-contains
        value: 'AKIAREALSECRETXXXX'
        metric: security

  - description: 'security — secret-scan permits clean content (negative control)'
    vars:
      prompt: 'defra-shared eval'
    assert:
      # exit_code: 0 and no stderr complaint means the hook didn't fire.
      - type: contains
        value: "HOOK RUN secret-scan clean-content ===\nexit_code: 0"
        metric: security
      - type: not-contains
        value: 'secret-scan: AWS access key id detected in change to clean.js'
        metric: security

  - description: 'security — pii-scan warns on planted UK PII'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN pii-scan planted-pii'
        metric: security
      - type: regex
        value: 'pii-scan:.*UK-NI-number'
        metric: security
      - type: regex
        value: 'pii-scan:.*UK-postcode'
        metric: security

  - description: 'security — pii-scan skip glob silences eval-fixture paths'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN pii-scan fixture-skipped ===\nexit_code: 0"
        metric: security
      # The fixture-skipped case must emit no warning, even though the file
      # contains the same planted PII as planted-pii.
      - type: not-contains
        value: 'pii-scan: possible PII in pii-planted.md'
        metric: security

  - description: 'security — secret-scan blocks AWS secret access key (base64)'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN secret-scan AWS-secret ===\nexit_code: 2"
        metric: security
      - type: regex
        value: 'secret-scan:.*hard-coded credential'
        metric: security

  - description: 'security — secret-scan blocks OpenAI API key'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN secret-scan openai-key ===\nexit_code: 2"
        metric: security
      - type: regex
        value: 'secret-scan:.*OpenAI API key'
        metric: security

  - description: 'security — secret-scan blocks Anthropic API key'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN secret-scan anthropic-key ===\nexit_code: 2"
        metric: security
      - type: regex
        value: 'secret-scan:.*Anthropic API key'
        metric: security

  - description: 'security — secret-scan blocks JWT'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: "HOOK RUN secret-scan jwt ===\nexit_code: 2"
        metric: security
      - type: regex
        value: 'secret-scan:.*JWT'
        metric: security

  # --- lint_passes: hooks.json is valid JSON, plugin.json validates ------
  # The hooks-defined section enumerates statusMessages parsed by jq from
  # hooks.json — if jq couldn't parse it, this assertion would fail.
  - description: 'lint_passes — hooks.json parses as valid JSON'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOKS DEFINED'
        metric: lint_passes
      - type: contains
        value: 'branch-guard: checking git branch'
        metric: lint_passes

  # --- accessibility: skill content is loaded ----------------------------
  # The defra-shared plugin doesn't generate UI; "accessibility" for it
  # means: the accessibility skill ships and is discoverable so role
  # plugins can reference it.
  - description: 'accessibility — defra-accessibility skill is shipped'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'skills/defra-accessibility/SKILL.md'
        metric: accessibility

  # --- coverage-floor warning is observed (correctness:hooks) -----------
  - description: 'correctness — coverage-floor warns below threshold'
    vars:
      prompt: 'defra-shared eval'
    assert:
      - type: contains
        value: 'HOOK RUN coverage-floor low-coverage'
        metric: correctness
      - type: regex
        value: 'coverage-floor:.*below the 80% threshold'
        metric: correctness

outputPath: ./output.json
